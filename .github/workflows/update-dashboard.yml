name: Update Coding Progress Dashboard

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants write permissions to push updates back

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # caching pip dependencies

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Fetch Stats and Generate Dashboard
      run: |
        python update_stats.py

    - name: Commit and Push Updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json assets/coding-dashboard.svg
        # Only commit if there are differences, prevents workflow failures
        git diff-index --quiet HEAD || (git commit -m "Auto-update coding stats and SVG [skip ci]" && git push)
